name: Open a new discussion when an incident is declared

on:
  repository_dispatch:
    types: [incident-declared]

jobs:
  open_discussion:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      discussions: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0

      - name: Bundle install
        run: bundle install

      - name: Open discussion
        id: open_discussion
        run: .github/actions/open_incident_discussion.rb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLIC_TITLE: ${{ github.event.client_payload.publicTitle }}
          INCIDENT_URL: ${{ github.event.client_payload.incidentLink }}
