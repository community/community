name: Close incident discussion after time elapsed

on:
  workflow_dispatch:
  schedule:
    # daily at midnight UTC
    - cron: "5 0 * * *"

jobs:
  close_incident_post:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      discussions: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94

      - name: Bundle install
        run: bundle install

      - name: Close incident discussions
        id: close_discussions
        run: .github/actions/close_incident_discussions.rb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
