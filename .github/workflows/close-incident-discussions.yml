name: Close incident discussion after time elapsed

on:
  workflow_dispatch:
  schedule:
    # daily at midnight UTC
    - cron: "5 0 * * *"

jobs:
  close_incident_post:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      discussions: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0

      - name: Bundle install
        run: bundle install

      - name: Close incident discussions
        id: close_discussions
        run: .github/actions/close_incident_discussions.rb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
