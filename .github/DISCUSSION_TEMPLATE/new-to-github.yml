labels: ["New To GitHub 👋 ", "Question", "source:ui"]
body:
  - type: markdown
    attributes:
      value: |
         :wave: Looking to say hello and meet the community? Introduce yourself in [A Welcome to GitHub](https://github.com/orgs/community/discussions/new?category=a-welcome-to-github) :wave:
  - type: markdown
    attributes:
      value: |
         ⚠️ The Community can not help with account-related issues, such as reinstatement requests or help to escalate your [GitHub Support](https://support.github.com/contact) tickets. ⚠️

  - type: markdown
    attributes:
      value: |
         ‼️ This space is for new user questions only. Reporting a bug or product feedback? Use the sidebar to find the appropriate feature area and leave it there. ‼️ 

 

  - type: dropdown
    attributes:
      label: "💬 Feature/Topic Area"
      description: Which area best matches your post?
      options:
        - Actions
        - APIs and Webhooks
        - Code Scanning
        - Code Search and Navigation
        - Code Security
        - Codespaces
        - Command Palette
        - Copilot
        - Dependabot
        - Discussions
        - Enterprise
        - Feed
        - GHAS
        - Gists
        - GitHub Desktop
        - GitHub Education
        - Issues
        - Lists
        - Markdown
        - Mobile
        - Models
        - Notifications
        - Packages
        - Pages
        - Profile
        - Projects
        - Pull Requests
        - Repositories
        - Security and Privacy
        - Sponsors
        - UI/UX
        - Visual Studio
        - VSCode
        - Wiki
        - Other
    validations:
      required: true

  - type: textarea
    attributes:
      label: Body
      description: Start your discussion! Include what you expected to happen, what actually happened, and any screenshots/logs that help.
      placeholder: |
        What are you trying to do?
        What did you expect to happen?
        What happened instead?
        Any links/screenshots?
    validations:
      required: true
